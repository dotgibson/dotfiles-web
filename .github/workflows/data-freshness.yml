name: Data freshness

# The showcase restates facts that live in dotfiles-core — most load-bearing of
# all, which Core RELEASE it claims to document. collect-metrics.mjs is lenient by
# default (the Pages runner only clones THIS repo, so it can't read the fleet and
# keeps the committed snapshot), which is also exactly how a stale generated.json
# silently ships. This guard closes that gap WITHOUT needing the sibling repos: it
# asks the GitHub API for the latest dotfiles-core release tag and compares it to
# the Core version baked into the committed src/data/generated.json. If the data is
# behind the latest Core release, it FAILS with a nudge to regenerate and commit.
#
# Note the narrow scope of that first job: it compares TWO VERSION STRINGS, and it is the
# only job here that needs no sibling repos at all. Package counts, CI flags, the
# changelog, fleet.publicRepos, every core.* metric and all ten per-repo drift entries are
# invisible to it. The derived-data job below now regenerates and diffs ALL FOUR generated
# files — generated.json included — against fresh clones of the fleet, which is what closes
# that gap (#150, #160). Each of the other three was checked by nothing at all until that
# job reached it.
#
# The two are not redundant, and the difference is the point. `check` asks "does the
# committed file name the latest RELEASE?"; derived-data asks "is the committed file what
# regenerating against the fleet's current state would produce?". A Core release nobody has
# refreshed the site for fails the first and passes the second; a hand-edited package count
# fails the second and passes the first. Keeping `check` also keeps one guard that still
# runs when the clones fail or the fleet is unreachable.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC — weekly drift sweep
  workflow_dispatch:
  pull_request:
    paths:
      - "src/data/generated.json"
      - "src/data/corpus.json"
      - "src/data/coverage.json"
      - "src/data/snippets.json"
      - "scripts/collect-metrics.mjs"
      - "scripts/collect-corpus.mjs"
      - "scripts/collect-coverage.mjs"
      - "scripts/collect-snippets.mjs"
      # Shared by all four collectors: it alone decides WHERE the fleet is. A change here
      # can repoint every one of them at once, or make them resolve nothing and take their
      # lenient no-op path — which is the same silent staleness this workflow exists to
      # catch, arriving through the one file that names none of the data.
      - "scripts/lib/fleet-root.mjs"
      - "src/content/docs/reference/porting-matrix.md"
      - ".github/workflows/data-freshness.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Only meaningful on the canonical owner's repo — forks won't have the
    # source repos under dotgibson and shouldn't fail on this.
    if: github.repository_owner == 'dotgibson'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare committed Core version against the latest dotfiles-core release
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Latest published release tag of dotfiles-core (built-in token, no PAT).
          latest="$(gh api "repos/${OWNER}/dotfiles-core/releases/latest" \
            --jq '.tag_name' 2>/dev/null || true)"
          if [ -z "${latest:-}" ] || [ "${latest}" = "null" ]; then
            echo "::warning::could not resolve the latest dotfiles-core release tag" \
                 "(no releases yet, or the API is unreachable) — skipping the freshness check."
            exit 0
          fi

          # What the committed snapshot claims. Tolerate a missing field rather than
          # crashing the guard: a snapshot with no version is its own (separate) bug.
          current="$(jq -r '.releases.current // empty' src/data/generated.json)"
          core_ver="$(jq -r '.drift.coreVersion // .core.version // empty' src/data/generated.json)"

          # Normalize to a bare semver (strip a leading v) for the comparison.
          norm() { printf '%s' "${1#v}"; }
          latest_n="$(norm "$latest")"
          current_n="$(norm "${current:-}")"
          core_n="$(norm "${core_ver:-}")"

          echo "latest dotfiles-core release : ${latest} (${latest_n})"
          echo "committed releases.current   : ${current:-<none>} (${current_n:-<none>})"
          echo "committed drift.coreVersion  : ${core_ver:-<none>} (${core_n:-<none>})"

          stale=0
          if [ -n "${current_n}" ] && [ "${current_n}" != "${latest_n}" ]; then stale=1; fi
          if [ -n "${core_n}" ] && [ "${core_n}" != "${latest_n}" ]; then stale=1; fi
          if [ -z "${current_n}${core_n}" ]; then
            echo "::error::src/data/generated.json has no Core version stamp" \
                 "(releases.current / drift.coreVersion / core.version all empty)." \
                 "Run 'npm run data' against the fleet and commit the result."
            exit 1
          fi

          if [ "${stale}" -eq 1 ]; then
            echo "::error::The committed src/data/generated.json is BEHIND the latest" \
                 "dotfiles-core release (${latest}). The showcase would advertise a" \
                 "stale Core version. Check out the fleet, run 'npm run data', and" \
                 "commit the refreshed generated.json."
            exit 1
          fi

          echo "OK — committed Core version matches the latest dotfiles-core release (${latest})."

  # The porting matrix is a VERBATIM mirror of dotfiles-core/PORTING-MATRIX.md, and
  # unlike generated.json nothing regenerates it — it is copied by hand. So it rots
  # silently, and it did: by 2026-08-04 the published page was a pre-v4.x snapshot
  # naming packages that are wrong or don't exist (bare `yq` instead of `yq-go`, cargo
  # builds for tools that are now packaged), with 9 of Core's 18 footnotes and ~15 tool
  # rows missing. It is the public install guide, so a stale copy actively sends readers
  # at unavailable packages. The /doc-audit routine in dotfiles-core caught it, but only
  # because a human ran it; this makes the drift fail a check instead.
  #
  # Compared against the latest RELEASE tag, not main, for the same reason the job above
  # does: the site documents a released Core, so an unreleased edit in Core must not turn
  # this red. Body-only — the Starlight frontmatter and the mirror note are ours.
  porting-matrix-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository_owner == 'dotgibson'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the mirrored porting matrix against dotfiles-core
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          MIRROR: src/content/docs/reference/porting-matrix.md
        run: |
          set -euo pipefail

          latest="$(gh api "repos/${OWNER}/dotfiles-core/releases/latest" \
            --jq '.tag_name' 2>/dev/null || true)"
          if [ -z "${latest:-}" ] || [ "${latest}" = "null" ]; then
            echo "::warning::could not resolve the latest dotfiles-core release tag" \
                 "— skipping the mirror check."
            exit 0
          fi

          # Same tolerance as the version guard: an unreachable API is a skip, not a
          # red build. A genuinely missing file, though, is a real problem — it would
          # mean Core moved or deleted the canonical doc out from under this mirror.
          # tr strips the API's line-wrapped base64 before decoding — GNU base64 tolerates
          # the wrapping, but not every base64 does, and this costs nothing.
          if ! gh api "repos/${OWNER}/dotfiles-core/contents/PORTING-MATRIX.md?ref=${latest}" \
                 --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > /tmp/core-matrix.md; then
            echo "::error::dotfiles-core has no PORTING-MATRIX.md at ${latest} — the" \
                 "canonical source this page mirrors is gone or was renamed."
            exit 1
          fi

          # The mirrored body is everything after the closing --> of our marker comment.
          # Anchoring on the marker (not a line count) keeps this working if the
          # frontmatter or the note is ever reworded.
          if ! grep -q '^-->$' "$MIRROR"; then
            echo "::error::${MIRROR} has no mirror marker comment — this guard cannot" \
                 "tell our header from Core's body. Restore the <!-- MIRROR ... --> note."
            exit 1
          fi
          awk 'f; /^-->$/ { f = 1 }' "$MIRROR" | sed '/./,$!d' > /tmp/web-matrix.md

          # Compare ignoring trailing blank lines, which an editor can add harmlessly.
          if diff -q <(sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba' /tmp/core-matrix.md) \
                     <(sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba' /tmp/web-matrix.md) >/dev/null; then
            echo "OK — the porting-matrix mirror is identical to dotfiles-core at ${latest}."
            exit 0
          fi

          echo "::error::${MIRROR} has drifted from dotfiles-core/PORTING-MATRIX.md at" \
               "${latest}. This is the PUBLIC install guide, so the drift is shipping wrong" \
               "package names to readers. Re-copy Core's file below the mirror comment," \
               "keeping the frontmatter and the note. Fix Core first if Core is the one wrong."
          echo "--- dotfiles-core (${latest})  +++ this repo ---"
          diff -u /tmp/core-matrix.md /tmp/web-matrix.md | head -100 || true
          exit 1

  # This job regenerates ALL FOUR generated files against fresh clones and fails on any
  # difference. It grew in three steps, and the history is worth keeping because each step
  # was prompted by a file that had already gone stale unnoticed.
  #
  # corpus.json and coverage.json came first. Until this job existed nothing validated
  # them — not the version guard above (it only opens generated.json), not fleet-sync (it
  # ran neither collector and didn't clone htpx),
  # not deploy (it runs them but commits nothing back, and its clone list omitted htpx so
  # the corpus collector silently no-opped every time). They also carried no stamp, so
  # their staleness was undetectable even in principle. The result was predictable: by
  # 2026-08-08 the committed corpus.json was 5 pairs behind htpx and coverage.json was 24
  # Sigma rules behind dotfiles-Defense, while /showcase-accuracy's own instructions told
  # every run to treat both as CI-verified ground truth.
  #
  # snippets.json came second, and it is the one where being outside the gate cost most.
  # corpus.json and coverage.json publish NUMBERS; snippets.json
  # publishes CONTENT — /config renders the baked text as a repo's real configuration,
  # under its real path, beside a link to that file on GitHub. A stale copy therefore does
  # not misreport a count, it shows a reader a config that no longer exists and then
  # invites them to click through to the one that does. It went stale exactly that way
  # between 2026-08-14 and #129, five of its eight sources drifted and nothing anywhere
  # said so. It sat outside the gate only because it was unstamped and so uncomparable;
  # the per-repo generatedFrom stamp it now carries is what makes it gateable.
  #
  # generated.json came third, and closes #150/#160. It was never OUTSIDE a gate — the
  # check job above has always opened it — but that gate compares one version string out of
  # ~2200 lines, so package counts, CI flags, fleet.publicRepos, every core.* metric, all
  # ten drift entries and the whole changelog were as unchecked as corpus.json used to be.
  # Not hypothetical: a bogus dotfiles-Windows drift entry once sat in a file CI called
  # fresh, which is why /showcase-accuracy told auditors to treat a surprising value here
  # as a lead rather than a fact. It also has the widest blast radius of the four, feeding
  # the landing page's metrics strip and repo cards, the architecture diagram, /changelog
  # and the version switcher in every page's header.
  #
  # Adding it made the clone list EXACTLY fleet-sync.yml's twelve, which is the right end
  # state rather than a coincidence: the bot that PRs the refresh and the job that fails
  # the build now read the same repos, run the same four collectors and diff with the same
  # expression, so they cannot disagree about what "in step" means.
  #
  # Unlike the jobs above this one needs the sources, so it clones the twelve repos those
  # four collectors read and REGENERATES the files, then fails if the result differs from
  # what is committed. Content-diffing rather than comparing source SHAs is deliberate: an
  # unrelated commit to htpx must not turn this red, only one that actually moves what the
  # site publishes.
  #
  # On the weekly cron this is an ALARM, not a defect: it runs Monday and fleet-sync runs
  # Tuesday, so a genuine drift shows up here a day before the bot PRs the refresh —
  # though for generated.json the core-release dispatch usually gets there first, so for
  # that file this is more often the PR gate than the alarm. On a pull request it is a
  # gate — the paths filter above scopes it to PRs that touch the data or its collectors,
  # and note that src/data/generated.json and scripts/collect-metrics.mjs have been in
  # that filter all along, for the check job. They now serve two jobs with different
  # failure modes: pruning either as "already covered" would silently remove this gate's
  # trigger while check still looked fine.
  derived-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository_owner == 'dotgibson'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone the fleet the four collectors read (read-only, shallow)
        id: fleet
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/fleet"
          mkdir -p "$root"
          # All required. The collectors exit 0 when a source is missing (leaving the
          # committed file untouched), which would make an unrefreshed snapshot look
          # green — so a failed clone has to fail the job here, and --strict below is the
          # second line of defence if one ever gets past this.
          #
          # This is the whole fleet, because collect-metrics.mjs reads the whole fleet:
          # dotfiles-core plus the ten machine/role repos. htpx is the odd one out — not a
          # dotfiles layer at all, but the source of the red/blue corpus /purple publishes.
          # collect-snippets.mjs's six are a strict SUBSET of the metrics eleven, its eight
          # curated files spanning all three layers (Core, four OS-native overlays, the
          # Offense role) because that spread IS what /config exists to show. All twelve are
          # public, so these are anonymous clones: no PAT, no token in a URL.
          #
          # The list is byte-for-byte fleet-sync.yml's loop, same order and same line
          # breaks. That is deliberate: two workflows hand-maintaining the same set is a
          # standing hazard, and identical text at least makes a divergence show up as a
          # diff rather than requiring someone to compare them as sets. (Three, counting
          # deploy.yml. A composite action is the real fix — see the follow-up issue.)
          #
          # Measured at 12 clones: ~11s and 95 MB, up from ~5s and 53 MB at eight. That
          # cost is why generated.json is handled HERE rather than in a job of its own.
          # The clone sets used to be disjoint, which made a second job look like free
          # parallelism; they now overlap almost entirely, so a second job would re-clone
          # the same eleven repos rather than parallelise anything — and leave two red X's
          # to read instead of one. The overlap argues for one job far more strongly than
          # the disjoint case ever argued against it.
          #
          # dotfiles-Offense, NOT dotfiles-Kali. The repo was renamed and github.com still
          # redirects the old name, so cloning dotfiles-Kali would SUCCEED — into a directory
          # called dotfiles-Kali, which is not the path collect-snippets.mjs joins. The
          # failure would surface two steps later as a --strict complaint about a missing
          # offensive/offensive.zsh, blaming a curated file that is perfectly fine. A
          # redirect that works is exactly what makes this worth writing down. It now bites
          # twice over: collect-metrics.mjs joins that same directory name for its own repo
          # list, so a dotfiles-Kali directory would fail its missing-repo check too, with
          # the equally misdirecting "missing repos: dotfiles-Offense".
          #
          # --depth 1 does still write refs/remotes/origin/HEAD, which this job leans on
          # harder than the corpus/coverage half did: collect-snippets.mjs resolves
          # defaultBranch from that ref and collect-metrics.mjs does the same, and the
          # comparison below deliberately does NOT strip it. A shallow clone that stopped
          # setting it would stamp defaultBranch null here against "main" in both committed
          # files, turning this job red over clone mechanics rather than drift. It does set
          # it — verified across all twelve of these repos, and fleet-sync has been proving
          # the same thing weekly, since its bot commits stamp defaultBranch "main" for
          # every one of the eleven.
          for r in dotfiles-core dotfiles-MacBook dotfiles-Alpine dotfiles-Arch dotfiles-Debian \
                   dotfiles-Defense dotfiles-Fedora dotfiles-Gentoo dotfiles-Offense \
                   dotfiles-openSUSE dotfiles-Windows htpx; do
            git clone --depth 1 "https://github.com/${OWNER}/${r}.git" "$root/$r"
          done
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Regenerate all four derived snapshots
        env:
          DOTFILES_ROOT: ${{ steps.fleet.outputs.root }}
        run: |
          set -euo pipefail
          # Four explicit invocations rather than `npm run data`, even though that script is
          # now exactly these four in exactly this order. Keeping them explicit means this
          # job's behaviour is readable HERE rather than in package.json, and an edit that
          # quietly drops a --strict from the npm script cannot change what CI does without
          # a diff in this file. The order is deliberately npm's, so a CI log and a local
          # `npm run data` can be read side by side.
          #
          # There is no setup-node and no npm ci here, on purpose: all four collectors
          # import only node: builtins (collect-metrics adds node:child_process for its
          # provenance stamps) plus scripts/lib/fleet-root.mjs, so the runner's preinstalled
          # node runs them as they are, and an install step would cost more than all twelve
          # clones and buy nothing.
          #
          # --strict on all four. For the three file-based collectors it turns a missing
          # source into a hard error instead of the silent exit 0 that would make an
          # unrefreshed snapshot look green. For collect-metrics it ALSO gates the
          # fleet-cleanliness preflight, which passes here structurally — twelve fresh
          # clones are on their default branch with an empty `git status` — and which
          # fleet-sync has been proving weekly against these same repos and the same
          # shallow clones.
          #
          # stdout is discarded for metrics alone: it dumps its whole payload minus the
          # changelog, feed included, which is ~1400 lines of log sitting directly above
          # the diff a reader actually came for. Errors go to stderr and still surface.
          node scripts/collect-metrics.mjs --strict > /dev/null
          node scripts/collect-snippets.mjs --strict
          node scripts/collect-corpus.mjs --strict
          node scripts/collect-coverage.mjs --strict

      - name: Compare the regenerated snapshots against what is committed
        run: |
          set -euo pipefail

          # generatedAt is day-granular and the commit fields track each source repo's HEAD;
          # both move without the published content changing, so neither may turn the build
          # red on its own. This is the SAME expression fleet-sync.yml strips with, character
          # for character, and that is the point rather than a coincidence: the bot deciding
          # to open a refresh PR and this job deciding to fail the build must never disagree
          # about what counts as a change, or a green build sits beside an open "the data
          # drifted" PR — or worse, this stays green on drift the bot will not PR.
          #
          # Its type guard and its `?` are what let ONE filter cover all THREE stamp shapes.
          # corpus/coverage carry a single generatedFrom.{repo,path,commit}, where .repos[]?
          # matches nothing and the whole thing reduces exactly to the
          # del(.generatedAt, .generatedFrom.commit) this used to say. snippets.json carries
          # generatedFrom.{clean,repos{}} instead, because its curated set spans six repos —
          # six SHAs, each moving on every unrelated commit to its own repo — and
          # generated.json carries that same shape over ELEVEN. The old flat form does not
          # reach any of them, so leaving it would have failed this job on days when nothing
          # the site publishes had changed at all.
          #
          # Only the commit fields are stripped, NOT generatedFrom wholesale:
          #   • .repo / .path are hardcoded in the corpus/coverage collectors, so they change
          #     only when someone repoints a collector at a different source — a change that
          #     must be committed, and which would otherwise slip through whenever the new
          #     source happened to yield identical numbers.
          #   • .clean, .unclean, .branch, .defaultBranch and .dirty are KEPT, for the reason
          #     fleet-sync keeps them: in a fresh shallow clone they are always true / absent
          #     / the default branch / false, so they can only differ when the COMMITTED file
          #     was generated from a feature branch or a dirty working tree. That is the
          #     local-publish accident of 2026-08-16 in file form — real signal, not noise.
          strip='del(.generatedAt) | if (.generatedFrom|type)=="object" then del(.generatedFrom.commit, .generatedFrom.repos[]?.commit) else . end'

          # How a diff gets PRINTED, per file. corpus/coverage pretty-print fine — neither
          # has a line over 100 columns. snippets.json does not: it bakes whole config files
          # as single JSON strings, so it is 158 lines whose longest runs 8743 columns, and a
          # one-line drift appears as a "-"/"+" pair that is byte-identical for its first
          # several hundred columns because the difference sits thousands of columns off the
          # right edge. A reader sees a diff that looks like a no-op — the gate would fail
          # while appearing to report nothing. Unfolding each snippet back into real lines
          # first makes it an ordinary line-oriented diff (8743 columns down to 140), so
          # head -60 shows the actual changed line in context. The stamp fields are re-emitted
          # as header lines so a clean / branch / dirty difference stays visible in the output
          # rather than surviving only in the exit code.
          snippets_render='
            "generatedFrom.clean = \(.generatedFrom.clean)",
            (.generatedFrom.unclean[]? | "generatedFrom.unclean: \(.)"),
            (.generatedFrom.repos // {} | to_entries[]
               | "repo \(.key): branch=\(.value.branch) default=\(.value.defaultBranch) dirty=\(.value.dirty)"),
            (.snippets[]
               | "=== \(.id)  (\(.shown) of \(.total) lines, truncated=\(.truncated))", .content)
          '

          # generated.json has snippets.json's problem wearing a different disguise, and the
          # distinction matters enough to keep two renderers rather than one. It pretty-prints
          # to 2181 lines whose longest runs 4042 columns — but where snippets.json's .content
          # strings carry real newlines that jq -r unfolds for free, these are changelog and
          # feed entries whose whitespace the collector has already collapsed to single
          # spaces. There is nothing to unfold: each is ONE unbroken 4000-column line. A
          # one-word drift in a release note therefore shows as a "-"/"+" pair identical for
          # its first several hundred columns, and the gate fails while appearing to report
          # nothing. So this renderer word-WRAPS where the other one unfolds. Measured: 4042
          # columns down to 101.
          #
          # Everything else is a flat, sorted projection of the fields the site actually
          # publishes — stamp, then scalars, then the per-repo maps, then the prose. That
          # order is deliberate: a Core release moves all of it, and the first hunk of a
          # truncated diff should be the version bump, the package counts and the ten drift
          # rows rather than the middle of a changelog entry.
          #
          # sort_by(.key) on every to_entries is load-bearing, not tidiness. jq preserves an
          # object's input key order, and collect-metrics.mjs builds packages / ci /
          # drift.repos by iterating [core, ...osRepos] — deterministic today and silently
          # reorderable by anyone who edits that array. Sorting makes this projection depend
          # on the DATA rather than on the collector's loop order, so a reordering cannot
          # fabricate a thousand-line diff out of a file that has not changed.
          #
          # .date and .summary are optional: JSON.stringify drops date on an Unreleased block
          # and summary when it is empty, so // "undated" and // empty keep those lines from
          # rendering a bare null. .drift.repos is heterogeneous too — dotfiles-Windows
          # carries mirroredFrom and no carried/ref, the other nine the reverse — and all four
          # keys are printed unconditionally on purpose: a conditional projection would change
          # a row's SHAPE when a repo's status flipped, turning a one-field change into a
          # structural diff.
          #
          # $word inside the single quotes reaches jq verbatim: bash does not re-scan the
          # result of expanding "$render" for further expansion. That is the same reason
          # snippets_render can be written single-quoted here and used double-quoted below.
          generated_render='
            def wrap: split(" ")
              | reduce .[] as $word ([];
                  if (length == 0) or ((.[-1] | length) + 1 + ($word | length)) > 88
                  then . + [$word] else .[0:-1] + [.[-1] + " " + $word] end)
              | .[];
            "generatedFrom.clean = \(.generatedFrom.clean)",
            (.generatedFrom.unclean[]? | "generatedFrom.unclean: \(.)"),
            (.generatedFrom.repos // {} | to_entries | sort_by(.key)[]
               | "repo \(.key): branch=\(.value.branch) default=\(.value.defaultBranch) dirty=\(.value.dirty)"),
            "fleet.publicRepos = \(.fleet.publicRepos)",
            "fleet.layers = \(.fleet.layers)",
            "releases.current = \(.releases.current)",
            "releases.channels = \(.releases.channels | join(", "))",
            "drift.coreVersion = \(.drift.coreVersion)",
            (.core // {} | to_entries | sort_by(.key)[] | "core.\(.key) = \(.value)"),
            (.packages // {} | to_entries | sort_by(.key)[] | "packages.\(.key) = \(.value)"),
            (.ci // {} | to_entries | sort_by(.key)[] | "ci.\(.key) = \(.value)"),
            (.drift.repos // {} | to_entries | sort_by(.key)[]
               | "drift \(.key): status=\(.value.status) carried=\(.value.carried) ref=\(.value.ref) mirroredFrom=\(.value.mirroredFrom)"),
            (.changelog[]?
               | "=== changelog \(.repo) @ \(.version) (\(.date // "undated"))",
                 (.summary // empty | wrap | "    summary: \(.)"),
                 (.groups[]? | "  --- \(.category)",
                    (.items[]? | "    * [\(.kind)]", (.text | wrap | "      \(.)")))),
            (.feed[]?
               | "--- feed \(.repo) @ \(.version) \(.date // "undated") \(.category)/\(.kind) core=\(.core)",
                 (.text | wrap | "    \(.)"))
          '

          stale=0
          for f in generated corpus coverage snippets; do
            # Where the drift would actually surface, and what it costs a reader — all
            # per-file, because naming the wrong page throws away the only part of this
            # message that tells someone where to go and look. /purple publishes the corpus
            # and coverage numbers, /config renders the baked snippets, and generated.json is
            # the widest of the four: the landing page's metrics strip and repo cards, the
            # architecture page's drift diagram, /changelog, and the version switcher in
            # every page's header.
            #
            # `cmd` is not `$f`. Three of these file names double as npm script names, but
            # generated.json's collector is `npm run metrics` — telling a reader to run
            # `npm run generated` would send them at a script that does not exist, in the one
            # message whose entire job is to say what to do next.
            #
            # `lines` is per-file too. diff -u already elides unchanged regions, so this caps
            # HUNKS rather than file length, and 60 is plenty for the other three. It is not
            # for this one: a real week-over-week drift here (a Core release plus the fleet
            # re-vendoring it) runs to several hundred diff lines, and the projection is
            # ordered so the numbers come first precisely so that a truncated diff truncates
            # the prose instead of the metrics.
            case "$f" in
              generated)
                page="/, /architecture and /changelog"
                harm="stale metrics, vendoring drift and changelog"
                cmd="metrics" ; render="$generated_render" ; lines=200 ;;
              snippets)
                page="/config" ; harm="stale config files"
                cmd="snippets" ; render="$snippets_render" ; lines=60 ;;
              *)
                page="/purple" ; harm="stale counts"
                cmd="$f"       ; render='.'                ; lines=60 ;;
            esac

            old="$(git show "HEAD:src/data/${f}.json" | jq "$strip")"
            new="$(jq "$strip" "src/data/${f}.json")"
            if [ "$old" = "$new" ]; then
              echo "OK — src/data/${f}.json matches its source."
              continue
            fi
            stale=1
            echo "::error::src/data/${f}.json is BEHIND its source. The showcase" \
                 "would publish ${harm} on ${page}. Check out the fleet as siblings" \
                 "and run 'npm run ${cmd}' (or 'npm run data'), then commit the result."
            echo "--- committed  +++ regenerated (src/data/${f}.json) ---"
            # awk rather than `head -n`, because it reads the diff to EOF and can therefore
            # say how much it is NOT showing. A truncation that does not admit it is
            # truncating is how a reader concludes an 800-line drift was a 60-line one.
            diff -u <(printf '%s\n' "$old" | jq -r "$render") \
                    <(printf '%s\n' "$new" | jq -r "$render") \
              | awk -v max="$lines" 'NR<=max; END {
                  if (NR>max) printf "… %d more diff line(s) suppressed (showing the first %d of %d).\n", NR-max, max, NR
                }' || true
          done

          exit "$stale"

  # generated.json is derived from the sibling repos' WORKING TREES, so a sibling parked
  # on a feature branch or holding uncommitted edits gets that unmerged work absorbed and
  # published. It happened on 2026-08-16: dotfiles-core sat on a feature branch and an
  # `npm run metrics` run published a changelog entry that exists on no branch of Core's
  # main. collect-metrics.mjs now records the verdict of its own preflight in
  # generatedFrom.clean, and scripts/install-hooks.mjs installs a pre-commit hook that
  # refuses such a snapshot.
  #
  # That hook protects exactly ONE machine — it lives in .git/hooks, is untracked, is
  # skipped when core.hooksPath is set, and is one --no-verify away from irrelevant. It
  # also protects exactly ONE FILE: it stages nothing but generated.json. This job is the
  # durable half on both counts, and it is the cheap half too: it clones nothing and
  # re-derives nothing, it just reads the stamps on the files being proposed.
  committed-data-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository_owner == 'dotgibson'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse site data derived from an unclean fleet
        run: |
          set -euo pipefail

          # BOTH stamped files, not just generated.json. collect-snippets.mjs stamps the
          # identical clean/unclean verdict over its own six sources, and snippets.json is
          # where an absorbed local edit does the most damage: generated.json would publish
          # a wrong NUMBER, while snippets.json publishes the edited file's CONTENT on
          # /config as that repo's real configuration.
          #
          # It also fails differently, which is why this is symmetry with a point. For
          # generated.json this job is a backstop — collect-metrics.mjs refuses an unclean
          # fleet outright and the pre-commit hook refuses the commit. collect-snippets.mjs
          # only WARNS and writes the file anyway, and the hook does not stage snippets.json
          # at all, so for that file this job is the ONLY thing that refuses.
          #
          # Nor is it redundant with derived-data above, which does also go red on such a
          # file, since clean/unclean sit inside the payload it compares. That job reports it
          # as STALENESS and tells you to re-run the collector — advice that, for snippets,
          # re-absorbs the same dirty tree and changes nothing. Naming the offending repos
          # and saying settle them is the difference between a diagnosis and a fix.
          #
          # Accumulate rather than exiting on the first offender: when the fleet was dirty at
          # generation time BOTH files are usually contaminated, and reporting one at a time
          # turns one fix into two round trips through CI.
          bad=0
          for f in generated snippets; do
            # NOT `.generatedFrom.clean // "absent"` — jq's // treats false as empty, so the
            # single value this job exists to catch would report as "absent" and pass. Ask
            # whether the key EXISTS, then stringify it.
            clean="$(jq -r '
              if (.generatedFrom | type) == "object" and (.generatedFrom | has("clean"))
              then (.generatedFrom.clean | tostring) else "absent" end
            ' "src/data/${f}.json")"

            case "$clean" in
              true)
                echo "OK — src/data/${f}.json was derived from a clean fleet."
                ;;
              false)
                bad=1
                echo "::error::src/data/${f}.json was derived from an UNCLEAN fleet, so it" \
                     "publishes unmerged work as fact. Offending repos:"
                jq -r '.generatedFrom.unclean[]? | "  • " + .' "src/data/${f}.json"
                echo "::error::Settle those sibling repos (commit, stash, or return them to" \
                     "their default branch), then re-run 'npm run data' and commit the" \
                     "regenerated file. Settling them is the whole fix: collect-metrics" \
                     "fails rather than absorbing, but collect-snippets only warns and" \
                     "writes, so re-running against a still-dirty tree reproduces this."
                ;;
              null)
                echo "::warning::src/data/${f}.json could not fully verify its sources" \
                     "(a sibling was not a git checkout), so its provenance is incomplete."
                ;;
              absent)
                # A file committed before the stamp existed, or hand-edited. Not worth failing
                # a build over on its own — the freshness jobs above already catch staleness —
                # but it means this guard has nothing to check.
                echo "::warning::src/data/${f}.json carries no generatedFrom.clean stamp," \
                     "so its provenance is unverifiable. Regenerate it with 'npm run data'."
                ;;
            esac
          done

          exit "$bad"
