name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC — rebuild to refresh the live /status board (and the repo-card badges)
  workflow_dispatch:
    inputs:
      dotfiles_ref:
        description: "Tag/branch to pin the fleet to when regenerating metrics (e.g. v1.0.0). Empty = ship the committed src/data/generated.json as-is."
        required: false
        default: ""
  # Lets a source repo rebuild & redeploy the docs — the static-site equivalent of
  # a cache purge (there is no per-request cache to invalidate; you re-publish the
  # artifact). Two event types, both POSTed as a repository_dispatch:
  #   release — pin the whole fleet to a freshly cut tag, then rebuild:
  #     {"event_type":"release","client_payload":{"ref":"v1.0.0"}}
  #   refresh — rebuild from each repo's DEFAULT branch (no ref needed), e.g. on a
  #     push to a source repo whose CHANGELOG/metrics the showcase mirrors.
  #     {"event_type":"refresh"}
  # The POST is authenticated by a short-lived fleet GitHub App token, minted by the
  # dispatching repo and scoped to this repo's contents:write (it replaced the
  # WEBHOOK_SECRET PAT — dotgibson/dotfiles-core#683). GitHub verifies the caller via that
  # token, so no HMAC signature layer is needed on this (static, server-less) side.
  repository_dispatch:
    types: [release, refresh]

# Allow GITHUB_TOKEN to deploy to Pages. `actions: read` lets the build read the
# latest workflow-run conclusion for the repo cards (other public repos resolve
# anonymously; private/forbidden ones just fall back to no CI badge).
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Serialize per ref: production deploys on main never get blocked by PR
# validation runs (each ref gets its own group). Don't cancel in-progress
# production deploys; do cancel superseded PR builds.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned-metrics build (opt-in). When a ref is supplied — via workflow_dispatch
      # or a `release` repository_dispatch — check out the whole fleet at that ref so
      # the next step can regenerate src/data/generated.json from a RELEASE rather
      # than whatever was last committed. Fails fast if a repo can't be cloned at
      # all, so a release build can never silently ship the committed snapshot; a
      # missing TAG (OS repos version independently — see core.lock) falls back to
      # the default branch. Normal pushes skip this entirely.
      #
      # Split into two steps below because a composite action cannot carry this gate: it
      # is deploy-specific, and it must run BEFORE anything is fetched.
      - name: Require a ref for a pinned build
        id: pinned
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dotfiles_ref != '') || github.event_name == 'repository_dispatch' }}
        env:
          REF: ${{ github.event.inputs.dotfiles_ref || github.event.client_payload.ref }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          # A `release` dispatch (or a manual pinned build) MUST carry a ref so the
          # docs are built from a TAGGED fleet — bail loudly if it doesn't. A
          # `refresh` dispatch intentionally carries no ref: it rebuilds from each
          # repo's default branch (the cache-purge path), so an empty REF is fine.
          if [ -z "${REF:-}" ] && [ "${EVENT_ACTION:-}" != "refresh" ]; then
            echo "::error::pinned build triggered without a ref (set dotfiles_ref / client_payload.ref)"
            exit 1
          fi
      # The clone itself: scripts/fleet-repos.txt is the list (shared with the collectors,
      # so a pinned build demands exactly the repos collect-metrics.mjs requires) and
      # .github/actions/clone-fleet is the loop. A repo without the tag falls back to its
      # default branch, since the OS repos version independently — see core.lock.
      - name: Check out the fleet at a pinned ref
        id: fleet
        # 'skipped' on a normal push, so this rides the gate above rather than
        # restating its condition. Neither step sets continue-on-error, so outcome
        # and conclusion agree.
        if: ${{ steps.pinned.outcome == 'success' }}
        uses: ./.github/actions/clone-fleet
        with:
          ref: ${{ github.event.inputs.dotfiles_ref || github.event.client_payload.ref }}
          token: ${{ github.token }}

      - name: Regenerate the derived data from the pinned fleet
        if: ${{ steps.fleet.outputs.root != '' }}
        # All four collectors — metrics, snippets, corpus, coverage — each defensive
        # (no-op if its source repo is absent). Nothing is committed back here; the
        # refreshed JSON lives only in this build's dist/. fleet-sync.yml is what PRs it
        # into the repo, and data-freshness.yml is what fails when the committed copy has
        # fallen behind.
        run: npm run data
        env:
          DOTFILES_ROOT: ${{ steps.fleet.outputs.root }}

      # Types, before the build rather than after it. `npm run check` has existed as a
      # script since the site was set up and no workflow ever called it, so the repo was
      # green on a gate nothing invoked — which is how three errors in src/data/site.ts
      # and src/components/Footer.astro sat unnoticed long enough that `footerLinks`
      # resolved to `unknown` in a shipped component.
      #
      # It runs HERE, and not as its own job, because it is the same install and the same
      # `astro sync` the build already does: a separate job would re-clone, re-install and
      # re-sync to learn something this one already has in hand. Before the build for the
      # ordinary reason — a type error is cheaper to report than a bundle is to produce —
      # and because failing here stops a broken tree reaching the upload/deploy steps.
      #
      # WHAT IT GATES, precisely: astro check's default failing severity is `error`, so
      # errors fail the build and warnings and hints do not. The tree is at 0/0/8 today.
      # Those eight hints are deliberately NOT gating: turning them red is a separate
      # decision about each hint, not a side effect of switching the gate on, and a gate
      # introduced already-failing is one people learn to route around.
      #
      # It needs no extra install — @astrojs/check and typescript are devDependencies, so
      # `npm ci` above already provides them.
      - name: Type-check with Astro
        run: npm run check

      - name: Build with Astro
        run: npm run build
        env:
          # Higher GitHub API rate limit + Actions access for the live repo-card
          # badges. Build is resilient if this is unset or the API is unreachable.
          GITHUB_TOKEN: ${{ github.token }}

      # On pull requests we only build to validate; the upload + deploy below
      # are gated to pushes to main so PRs don't touch the live site.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
