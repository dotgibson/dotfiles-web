name: fleet-sync

# Keep the showcase site's DERIVED data in step with the actual fleet. The changelog
# page and the "by the numbers" strip both read src/data/generated.json, which
# scripts/collect-metrics.mjs builds from each sibling repo's CHANGELOG.md + package
# manifests. That only refreshes when someone runs `npm run metrics` locally with the
# siblings checked out — so it silently rots. This bot re-derives it weekly against
# fresh clones of the fleet and opens a PR when the numbers/changelog have drifted;
# merging it triggers deploy.yml to rebuild the site. workflow_dispatch refreshes on demand,
# and a `core-release` repository_dispatch from dotfiles-core runs it the moment a new Core
# release ships — so the committed generated.json tracks the tag without a day's cron lag.
#
# AUTH — why not the built-in GITHUB_TOKEN: a branch pushed / PR opened with the default
# GITHUB_TOKEN does NOT trigger `pull_request` (or `push`) workflows — GitHub's recursion
# guard. So a refresh PR authored by GITHUB_TOKEN would sit forever with build + data-freshness
# never running and mergeable_state "blocked". We therefore push the branch and open the PR
# with the fleet GitHub App token (the same identity + pinned action as dotfiles-core's
# sync-fanout.yml — see GITHUB-APP-AUTH.md), falling back to the legacy FLEET_SYNC_TOKEN PAT.
# Both are non-GITHUB_TOKEN identities, so the PR's checks run and it can actually be merged.
# If NEITHER is configured we fall back to GITHUB_TOKEN — the PR still opens (no hard failure),
# it just won't auto-trigger CI until a human nudges it, exactly the old behaviour.
# create-github-app-token is GitHub's own action, SHA-pinned (no untrusted marketplace action).
# A fixed branch keeps it idempotent (update, don't stack).

on:
  schedule:
    - cron: "0 8 * * 2" # Tuesdays 08:00 UTC
  workflow_dispatch:
  # dotfiles-core POSTs this the instant it publishes a release (its notify-web.yml).
  # Regenerating on release — not only on the Tuesday cron — keeps the COMMITTED
  # generated.json current, so Monday's data-freshness guard never goes red waiting
  # a day for the weekly refresh to catch up to a fresh Core tag.
  repository_dispatch:
    types: [core-release]

permissions:
  contents: read

concurrency:
  # Ref-independent: the bot always force-updates ONE fixed branch, so two runs
  # (e.g. a manual dispatch racing the cron) must never overlap, whatever ref launched them.
  group: fleet-sync
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the refresh branch
      pull-requests: write # open/update the PR
    env:
      BRANCH: automation/fleet-metrics
      OWNER: ${{ github.repository_owner }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Presence flag for the App private key (value is 'true'/'false', never the key):
      # secrets can't be tested in a step `if:`, but an env derived from a secret comparison
      # can. Gates the mint on the key ACTUALLY being present so a partial App setup (the
      # FLEET_APP_ID variable set org-wide but the key not scoped here) falls back cleanly.
      HAS_APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY != '' }}
    steps:
      # Check the site into a subdir so the rest of the fleet can sit beside it as
      # siblings — the layout collect-metrics.mjs expects (root = parent of this repo).
      # persist-credentials: false — do NOT leave the GITHUB_TOKEN in .git/config, or the
      # push below would authenticate as GITHUB_TOKEN (no CI trigger) whatever remote URL we set.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dotfiles-web
          persist-credentials: false
      # Mint a short-lived, repo-scoped installation token IF the fleet App is configured
      # (the FLEET_APP_ID variable is set and its private key is present). continue-on-error
      # so a repo the App isn't installed on falls through to the PAT / GITHUB_TOKEN chain
      # below instead of failing the run.
      - name: Mint a scoped installation token (if the fleet App is configured)
        id: app
        if: vars.FLEET_APP_ID != '' && env.HAS_APP_KEY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Clone the fleet as siblings (read-only, shallow)
        run: |
          set -euo pipefail
          # All required: collect-metrics.mjs exits 0 (leaving generated.json untouched)
          # if a repo is missing, which would masquerade as "in step" — so a failed clone
          # must fail the job instead. (dotfiles-Debian is intentionally absent — no repo.)
          for r in dotfiles-core dotfiles-MacBook dotfiles-Alpine dotfiles-Arch dotfiles-Defense \
                   dotfiles-Fedora dotfiles-Gentoo dotfiles-Kali \
                   dotfiles-openSUSE dotfiles-Windows; do
            git clone --depth 1 "https://github.com/${OWNER}/${r}.git" "$r"
          done
      - name: Regenerate the derived data (metrics + config snippets)
        working-directory: dotfiles-web
        run: |
          node scripts/collect-metrics.mjs
          node scripts/collect-snippets.mjs
      - name: Open a PR if the derived data drifted
        working-directory: dotfiles-web
        env:
          # Prefer the App token, then the legacy PAT, then the built-in token. The first two
          # trigger the PR's checks; the last opens the PR but won't (the documented fallback).
          FLEET_TOKEN: ${{ steps.app.outputs.token || secrets.FLEET_SYNC_TOKEN || github.token }}
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.FLEET_SYNC_TOKEN || github.token }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # generatedAt is a day-granular stamp that changes on every run; judge metrics
          # drift on the real content only, and discard a stamp-only change so we don't PR
          # noise. snippets.json carries no timestamp, so a plain git diff is its drift test.
          old="$(git show HEAD:src/data/generated.json | jq 'del(.generatedAt)')"
          new="$(jq 'del(.generatedAt)' src/data/generated.json)"
          snips_changed=no
          git diff --quiet -- src/data/snippets.json || snips_changed=yes
          if [ "$old" = "$new" ] && [ "$snips_changed" = no ]; then
            git checkout -- src/data/generated.json src/data/snippets.json
            echo "✅ site data already in step with the fleet" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # persist-credentials:false left origin unauthenticated — point it at the token
          # so the push authenticates as the App (or PAT), the identity that triggers CI.
          git remote set-url origin "https://x-access-token:${FLEET_TOKEN}@github.com/${OWNER}/${REPO}.git"
          git switch -C "$BRANCH"
          git add src/data/generated.json src/data/snippets.json
          git commit -m "chore(data): refresh fleet metrics + changelog + config snippets (fleet-sync bot)"
          git push -f -u origin "$BRANCH"
          # Idempotent: update the existing PR if one is already open for this branch.
          if [ -z "$(gh pr list --repo "${OWNER}/${REPO}" --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "${OWNER}/${REPO}" --head "$BRANCH" --base "$DEFAULT_BRANCH" \
              --title "chore(data): refresh fleet metrics + changelog + config snippets" \
              --body "Automated by the fleet-sync bot. The derived site data (\`src/data/generated.json\` — changelog + by-the-numbers; \`src/data/snippets.json\` — the Config explorer's baked source files) was behind the fleet; this regenerates it via \`collect-metrics.mjs\` + \`collect-snippets.mjs\`. Review, let the build run, then merge — deploy.yml redeploys on merge."
          fi
          echo "📊 opened/updated PR on \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
