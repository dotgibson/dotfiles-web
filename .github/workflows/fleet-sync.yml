name: fleet-sync

# Keep the showcase site's DERIVED data in step with the actual fleet. The changelog
# page and the "by the numbers" strip both read src/data/generated.json, which
# scripts/collect-metrics.mjs builds from each sibling repo's CHANGELOG.md + package
# manifests. That only refreshes when someone runs `npm run metrics` locally with the
# siblings checked out — so it silently rots. This bot re-derives it weekly against
# fresh clones of the fleet and opens a PR when the numbers/changelog have drifted.
# It also re-mirrors reference/porting-matrix.md from Core's latest RELEASE, which was
# the last cross-repo fact here still copied by hand — and which rotted twice for
# exactly that reason;
# merging it triggers deploy.yml to rebuild the site. workflow_dispatch refreshes on demand,
# a `core-release` repository_dispatch from dotfiles-core runs it the moment a new Core
# release ships, and an hourly poll catches anything neither of those covers — a release
# whose dispatch never arrived, and any other movement in the fleet the four collectors
# read — so the committed data tracks the fleet without a week's cron lag. What that poll
# does and does not notice is the whole subject of the `precheck` job's note below.
#
# AUTH — why not the built-in GITHUB_TOKEN: a branch pushed / PR opened with the default
# GITHUB_TOKEN does NOT trigger `pull_request` (or `push`) workflows — GitHub's recursion
# guard. So a refresh PR authored by GITHUB_TOKEN would sit forever with build + data-freshness
# never running and mergeable_state "blocked". We therefore push the branch and open the PR
# with the fleet GitHub App token (the same identity + pinned action as dotfiles-core's
# sync-fanout.yml — see GITHUB-APP-AUTH.md). That is a non-GITHUB_TOKEN identity, so the PR's
# checks run and it can actually be merged. (A legacy FLEET_SYNC_TOKEN PAT used to sit between
# the two; it was deleted when G2 finished — dotfiles-core #683/#819 — so that rung is gone.)
# If the App is NOT configured we fall back to GITHUB_TOKEN — the PR still opens (no hard failure),
# it just won't auto-trigger CI until a human nudges it, exactly the old behaviour.
# create-github-app-token is GitHub's own action, SHA-pinned (no untrusted marketplace action).
# A fixed branch keeps it idempotent (update, don't stack).

on:
  schedule:
    - cron: "0 8 * * 2" # Tuesdays 08:00 UTC — full sweep of the whole fleet
    # Hourly backstop. Costs thirteen API calls and no clones unless the fleet has actually
    # moved past the committed data — see the `precheck` job, which gates the expensive half.
    - cron: "41 * * * *"
  workflow_dispatch:
  # dotfiles-core POSTs this the instant it publishes a release, so the COMMITTED
  # generated.json tracks a fresh Core tag immediately rather than waiting on the
  # Tuesday cron (which left Monday's data-freshness guard red for a day).
  #
  # This trigger sat unfired from the day it was added until it was fixed on the
  # SENDING side, and the reason is worth recording so it isn't reintroduced: the POST
  # lives in dotfiles-core's notify-web.yml, which listened for `release: published`.
  # But that Release is created by dotfiles-core's release.yml running `gh release
  # create` under the built-in GITHUB_TOKEN — and an event raised by GITHUB_TOKEN never
  # starts another workflow run (the same recursion guard the AUTH note above describes
  # for pull_request). The Release published, the event was inert, notify-web.yml never
  # ran, and nothing was ever POSTed here. release.yml now sends the dispatch itself,
  # right after publishing, instead of relying on that dead event.
  repository_dispatch:
    types: [core-release]

permissions:
  contents: read

jobs:
  # Cheap gate in front of the twelve-repo clone below. Every trigger EXCEPT the hourly
  # cron is a deliberate "go and look" and passes straight through; the poll alone has to
  # justify itself, with thirteen API calls and no checkout of the fleet.
  #
  # WHAT THE POLL ASKS, and why it changed (#168). It used to ask ONE question — is the
  # committed Core version behind the latest dotfiles-core release? — so it fired only when
  # Core cut a release. Everything else the four collectors read was invisible to it: an
  # Unreleased entry in Core's changelog, any OS repo's CHANGELOG.md / packages.txt /
  # Brewfile / core.lock, new htpx corpus entries, new Sigma rules in dotfiles-Defense, an
  # edited curated snippet file. That was a minor inefficiency until #165 gated
  # generated.json on CONTENT rather than on a version string; after it, this gate decides
  # how long `main` stays red. Observed the hour #165 merged: Core gained an Unreleased
  # entry and htpx gained corpus entries while both version strings stayed v4.14.0, so every
  # poll until Tuesday would have said "level" while Monday's data-freshness cron ran red on
  # drift no bot would PR — corrected by hand in #167, which is precisely the manual step
  # this bot exists to remove. The asymmetry was the actual defect: data-freshness
  # regenerates against the fleet and fails on ANY content difference, while this gate
  # decided whether to even look from ONE version string. The job that fails the build and
  # the bot that fixes it were asking different questions.
  #
  # So it now asks TWO, and refreshes if EITHER fires:
  #   1. is the committed Core version behind the latest release?   (one API call)
  #   2. has any repo in scripts/fleet-repos.txt moved past the SHA the committed data was
  #      generated from?                                            (twelve API calls)
  #
  # Neither subsumes the other, which is why both are kept. releases.current is derived from
  # Core's CHANGELOG.md headings rather than from the releases API (deriveReleases() in
  # collect-metrics.mjs), so a release cut on an already-committed commit moves no head SHA
  # and only (1) sees it; everything in the list above moves a head SHA without touching a
  # version string and only (2) sees it. The same reasoning keeps data-freshness.yml's
  # `check` job beside its `derived-data` job.
  #
  # (2) reads the per-repo `generatedFrom` stamps that #148 put in the committed files, so
  # it needs no new data — the SHA each snapshot was built from is already there.
  #
  # AND A MARKER, without which (2) would be worse than the bug it fixes. Those stamps only
  # advance when a refresh PR MERGES: on the no-drift path the metrics job runs
  # `git checkout --` and reverts all four files, and scripts/data-strip.jq deliberately
  # strips .commit so a SHA-only move is not drift. So a fleet commit that changes nothing
  # this site publishes — a README typo in dotfiles-Arch — leaves live != committed
  # PERMANENTLY, and (2) on its own would clone twelve repos (~11s, 95 MB) every hour
  # forever. The metrics job therefore records a tiny Actions-cache entry keyed on the
  # fingerprint of a fleet state it swept and found in step, and this gate stands down on a
  # state that already has one: a content-neutral fleet commit costs exactly ONE sweep
  # instead of one an hour. The latest Core tag is folded into the fingerprint so a newly
  # cut release re-arms the sweep even when no head moved. An unused cache entry is evicted
  # after 7 days, which costs at most one extra sweep a week — and a hit resets that clock.
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # read the open-PR guard below
    outputs:
      run: ${{ steps.gate.outputs.run }}
      # Handed to the metrics job, which records the marker described above. Empty when the
      # fleet could not be fingerprinted, which is how that job knows not to record one.
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job never pushes

      # Computed on EVERY trigger, not just the poll, so the weekly sweep and the
      # core-release dispatch also leave a marker behind. The poll that follows one of them
      # is then a lookup rather than a re-clone of a fleet that was just swept.
      - name: Fingerprint the fleet
        id: fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # The repo list comes from scripts/fleet-repos.txt through the same parser
          # collect-metrics.mjs uses — NOT an inline list, which
          # scripts/verify-fleet-manifest.mjs bans and should keep banning. No setup-node and
          # no npm ci, for the reason data-freshness.yml gives for the collectors: the module
          # imports only node: builtins, so the runner's preinstalled node runs it as it is.
          mapfile -t repos < <(node -e \
            "import('./scripts/lib/fleet-repos.mjs').then(m => console.log(m.readFleetRepos().all.join('\n')))")
          # `mapfile` cannot fail on a process substitution that did, so a broken import
          # would leave an EMPTY fleet here — and an empty fleet has nothing that moved, so
          # this gate would report "level" every hour forever and the poll would be silently
          # dead in exactly the way #168 describes. Fail loudly instead.
          if [ "${#repos[@]}" -eq 0 ]; then
            echo "::error::could not read the fleet from scripts/fleet-repos.txt"
            exit 1
          fi

          latest="$(gh api "repos/${OWNER}/dotfiles-core/releases/latest" \
            --jq '.tag_name' 2>/dev/null || true)"
          if [ -z "${latest:-}" ] || [ "${latest}" = "null" ]; then
            # No longer fatal to the poll, as it was when the release tag was the ONLY
            # question: condition (2) below stands on its own, so an unreachable releases
            # endpoint costs this run condition (1) rather than the whole gate.
            echo "::warning::could not resolve the latest dotfiles-core release tag —" \
                 "polling on fleet movement alone this run"
            latest=""
          fi

          # The default-branch head of each repo, one call each, no clones. `commits?per_page=1`
          # rather than a branch lookup because it needs no second call to learn what the
          # default branch is called.
          : >"$RUNNER_TEMP/heads"
          resolved=yes
          for r in "${repos[@]}"; do
            sha="$(gh api "repos/${OWNER}/${r}/commits?per_page=1" --jq '.[0].sha' 2>/dev/null || true)"
            if [ -z "${sha:-}" ] || [ "${sha}" = "null" ]; then
              echo "::warning::could not resolve the head of ${OWNER}/${r}"
              resolved=no
              continue
            fi
            printf '%s=%s\n' "$r" "$sha" >>"$RUNNER_TEMP/heads"
          done

          # What the committed data was generated FROM — the counterpart of data-strip.jq,
          # and shared with data-freshness.yml for the same reason: that job now CLONES THE
          # FLEET at whatever this returns before deciding whether to fail a PR, so the two
          # reading the same map is what keeps "the fleet has moved" and "the data is stale"
          # the same statement. The file carries the stamp shapes it tolerates and why.
          #
          # Argument ORDER is load-bearing and must match data-freshness.yml's:
          # from_entries lets the LAST occurrence of a duplicate key win, so generated.json's
          # eleven repos are read last and win. corpus.json is the only source of htpx's.
          # Eleven plus htpx is exactly the manifest's twelve.
          jq -s -f scripts/data-stamps.jq \
            src/data/snippets.json src/data/coverage.json \
            src/data/corpus.json src/data/generated.json >"$RUNNER_TEMP/stamps.json"

          moved=""
          while IFS='=' read -r r sha; do
            [ -n "$r" ] || continue
            was="$(jq -r --arg r "$r" '.[$r] // ""' "$RUNNER_TEMP/stamps.json")"
            # A repo with no committed stamp at all counts as moved — the same fail-open call
            # the version comparison makes for a snapshot that cannot say what it documents.
            [ "$sha" = "$was" ] || moved="${moved:+$moved }$r"
          done <"$RUNNER_TEMP/heads"

          # The fingerprint is over the fleet's STATE, not over what this run concluded about
          # it: the twelve heads plus the release tag. Sorted, so reordering
          # scripts/fleet-repos.txt cannot invalidate every marker. Left empty when any head
          # is unknown — a partial fingerprint would mark a state that was never fully seen.
          fp=""
          if [ "$resolved" = yes ]; then
            fp="$( { printf 'release=%s\n' "${latest:-<none>}"; sort "$RUNNER_TEMP/heads"; } \
                   | sha256sum | cut -d' ' -f1 )"
          fi

          echo "latest dotfiles-core release : ${latest:-<unresolved>}"
          echo "fleet repos that have moved  : ${moved:-<none>}"
          echo "fingerprint                  : ${fp:-<unresolved>}"

          {
            echo "latest=${latest}"
            echo "moved=${moved}"
            echo "resolved=${resolved}"
            echo "fingerprint=${fp}"
          } >>"$GITHUB_OUTPUT"

      # lookup-only: nothing is downloaded and nothing is written, this only asks whether an
      # entry exists. `path` is required by the action even so — the file itself is written
      # by the metrics job, at the end of a sweep that found the data in step.
      - name: Has this exact fleet state already been swept?
        id: marker
        if: steps.fingerprint.outputs.fingerprint != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fleet-swept
          key: fleet-swept-${{ steps.fingerprint.outputs.fingerprint }}
          lookup-only: true

      - name: Decide whether a full refresh is warranted
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: automation/fleet-metrics
          EVENT: ${{ github.event_name }}
          # github.event.schedule carries the cron line that fired, which is how the
          # hourly poll is told apart from the weekly sweep. Keep in step with `on:`.
          IS_POLL: ${{ github.event_name == 'schedule' && github.event.schedule == '41 * * * *' }}
          LATEST: ${{ steps.fingerprint.outputs.latest }}
          MOVED: ${{ steps.fingerprint.outputs.moved }}
          RESOLVED: ${{ steps.fingerprint.outputs.resolved }}
          # Empty on a cache miss, and empty again when the step above was skipped —
          # the unresolvable case the gate returns on before ever reading this. Never
          # the `false` a bare boolean would suggest, so do not compare it to one.
          SWEPT: ${{ steps.marker.outputs.cache-hit }}
        run: |
          set -euo pipefail

          if [ "${IS_POLL}" != "true" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "▶️ \`${EVENT}\` always refreshes — skipping the staleness gate" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A fleet this run could not fully fingerprint is one it cannot say anything about,
          # so the poll stands down and the Tuesday sweep stays the backstop — the same call
          # this gate has always made when it could not resolve what it needed.
          if [ "${RESOLVED}" != "yes" ]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "⚠️ could not fingerprint the whole fleet — skipping this poll" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # (1) Is the committed snapshot behind the latest Core release? The same question
          # data-freshness.yml's `check` job asks, asked hourly instead of weekly. Normalize
          # identically (strip a leading v) so the two guards can never disagree about what
          # "level" means. An absent stamp normalizes to empty, never matches a real tag, and
          # so refreshes — the right call for a snapshot that can't say what it documents.
          committed="$(jq -r '.releases.current // .drift.coreVersion // empty' src/data/generated.json)"
          norm() { printf '%s' "${1#v}"; }
          behind=no
          if [ -n "${LATEST}" ] && [ "$(norm "$LATEST")" != "$(norm "${committed:-}")" ]; then
            behind=yes
          fi

          echo "latest dotfiles-core release : ${LATEST:-<unresolved>}"
          echo "committed snapshot           : ${committed:-<none>}"
          echo "fleet repos that have moved  : ${MOVED:-<none>}"

          if [ "$behind" = no ] && [ -z "${MOVED}" ]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "✅ site data is level with \`${LATEST}\`, and no fleet repo has moved past" \
                 "the commits it was generated from" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Already looked, at this exact fleet state, and found the data in step. This
          # covers the version condition as well as the moved-repo one, deliberately:
          # re-cloning an unchanged fleet cannot fix a version mismatch either, and without
          # this that corner has the same fire-every-hour behaviour — a release whose
          # changelog entry never landed would poll forever and PR nothing.
          #
          # cache-hit is `true` on an exact hit and empty on a miss; the lookup carries no
          # restore-keys, so the `false` a partial hit would emit cannot reach us — it is
          # accepted anyway rather than tripping the warning. Read it through a case instead
          # of comparing to the literal, so an action version that words its answer
          # differently warns and sweeps rather than silently making the marker inert. That
          # failure restores the fire-every-hour behaviour this branch removed, with nothing
          # in the log to say it happened, which is why it is worth six lines to refuse it.
          case "${SWEPT}" in
            true)     already_swept=yes ;;
            false|'') already_swept=no ;;
            *)
              already_swept=no
              echo "::warning::actions/cache/restore reported cache-hit='${SWEPT}', which is" \
                   "neither true nor false — treating this fleet state as unswept" ;;
          esac

          if [ "$already_swept" = yes ]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "🗂️ this fleet state was already swept and found in step" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The fix may already be sitting in review. Re-cloning twelve repos every hour to
          # force-push a branch that is already correct helps nobody — the weekly sweep and
          # any manual dispatch still update an open PR, they just skip this guard.
          if [ -n "$(gh pr list --repo "${OWNER}/${REPO}" --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "⏸️ a refresh is warranted, but one is already open on \`${BRANCH}\`" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "run=true" >>"$GITHUB_OUTPUT"
          # Both reasons are reported when both hold: a Core release usually moves heads too,
          # and a summary naming only one of them reads as though the other did not apply.
          if [ "$behind" = yes ]; then
            echo "🔄 site data is behind \`${LATEST}\` — refreshing" >>"$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${MOVED}" ]; then
            echo "🔄 moved past the committed snapshot: \`${MOVED}\` — refreshing" >>"$GITHUB_STEP_SUMMARY"
          fi

  metrics:
    needs: precheck
    if: needs.precheck.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-scoped, NOT workflow-scoped: the bot always force-updates ONE fixed branch, so
    # two refreshes (e.g. a manual dispatch racing the cron) must never overlap, whatever
    # ref launched them — but at workflow scope the hourly precheck would cancel a refresh
    # already in flight. Guarding the expensive job alone keeps the poll harmless.
    concurrency:
      group: fleet-sync
      cancel-in-progress: true
    permissions:
      contents: write # push the refresh branch
      pull-requests: write # open/update the PR
    env:
      BRANCH: automation/fleet-metrics
      OWNER: ${{ github.repository_owner }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Presence flag for the App private key (value is 'true'/'false', never the key):
      # secrets can't be tested in a step `if:`, but an env derived from a secret comparison
      # can. Gates the mint on the key ACTUALLY being present so a partial App setup (the
      # FLEET_APP_ID variable set org-wide but the key not scoped here) falls back cleanly.
      HAS_APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY != '' }}
    steps:
      # Check the site into a subdir so the rest of the fleet can sit beside it as
      # siblings — the layout collect-metrics.mjs expects (root = parent of this repo).
      # persist-credentials: false — do NOT leave the GITHUB_TOKEN in .git/config, or the
      # push below would authenticate as GITHUB_TOKEN (no CI trigger) whatever remote URL we set.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dotfiles-web
          persist-credentials: false
      # Mint a short-lived, repo-scoped installation token IF the fleet App is configured
      # (the FLEET_APP_ID variable is set and its private key is present). continue-on-error
      # so a repo the App isn't installed on falls through to the PAT / GITHUB_TOKEN chain
      # below instead of failing the run.
      - name: Mint a scoped installation token (if the fleet App is configured)
        id: app
        if: vars.FLEET_APP_ID != '' && env.HAS_APP_KEY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      # All required: collect-metrics.mjs exits 0 (leaving generated.json untouched) if a
      # repo is missing, which would masquerade as "in step" — so a failed clone must fail
      # the job instead, which is the action's default.
      #
      # dest is the WORKSPACE, not the action's $RUNNER_TEMP default: the fleet has to
      # land as siblings of the dotfiles-web/ checkout above, the layout resolveFleetRoot()
      # finds without DOTFILES_ROOT.
      #
      # The `./dotfiles-web/` prefix is not a typo and must not be "fixed" to
      # `./.github/...`: local actions resolve against $GITHUB_WORKSPACE, and the checkout
      # above put this repo in a subdirectory of it.
      - name: Clone the fleet as siblings (read-only, shallow)
        uses: ./dotfiles-web/.github/actions/clone-fleet
        with:
          dest: ${{ github.workspace }}
      - name: Regenerate the derived data (all four collectors)
        working-directory: dotfiles-web
        run: npm run data
      # Separate from `npm run data` on purpose, and it is not an oversight that this reads
      # the API rather than the fleet checked out one step above. The four collectors are
      # pure local file reads and stay runnable offline; this one mirrors Core's
      # PORTING-MATRIX.md AT ITS LATEST RELEASE TAG, and the clone beside us is on Core's
      # DEFAULT BRANCH. Mirroring main is the trap this page has already fallen into once —
      # it turns data-freshness.yml's check red until that work ships. Same script that
      # check runs, so the two cannot disagree about what the mirror is.
      - name: Re-mirror the porting matrix from Core's latest release
        working-directory: dotfiles-web
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: npm run mirror
      - name: Open a PR if the derived data drifted
        id: refresh
        working-directory: dotfiles-web
        env:
          # Prefer the App token, then the built-in token. The App token triggers the PR's
          # checks; GITHUB_TOKEN opens the PR but won't (the documented fallback).
          FLEET_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          REPO: ${{ github.event.repository.name }}
          MIRROR: src/content/docs/reference/porting-matrix.md
          # The palette's CSS half. Like the mirror it is not JSON, so it is compared
          # with a plain `git diff` rather than through the filter.
          PALETTE_CSS: src/styles/global.css
        run: |
          set -euo pipefail
          # WHAT COUNTS AS DRIFT lives in scripts/data-strip.jq, which data-freshness.yml
          # reads too. Sharing one file is the point rather than tidiness: this step decides
          # whether to OPEN A REFRESH PR and that job decides whether to FAIL THE BUILD, so
          # the two disagreeing would leave a green build beside an open "the data drifted"
          # PR — or leave the build green on drift this bot will not PR. The filter carries
          # the reasoning for every field it keeps and drops; the short version is that
          # generatedAt and the per-repo commit SHAs move on every unrelated commit to any
          # sibling, which would otherwise PR every hour, while .branch / .dirty / .clean
          # are KEPT because in CI they can only differ when the COMMITTED file was built
          # from a feature branch or a dirty tree — the local-publish accident, not noise.
          #
          # ALL FOUR files go through it, snippets.json included — even though it is the one
          # file carrying no stamp today, so the filter is a no-op on it. That is deliberate.
          # It used to be compared with a plain `git diff`, correct only for as long as it
          # stayed unstamped: the moment a generatedAt appeared there, the plain diff would
          # report drift EVERY DAY with no content change and the bot would open a refresh PR
          # every day — the exact failure the filter prevents, reintroduced through the one
          # file that had been exempted from it. Handling it here removes the ordering hazard
          # instead of documenting it.
          content_changed=no
          for f in generated corpus coverage snippets palette; do
            old="$(git show "HEAD:src/data/${f}.json" | jq -f scripts/data-strip.jq)"
            new="$(jq -f scripts/data-strip.jq "src/data/${f}.json")"
            [ "$old" = "$new" ] || content_changed=yes
          done
          # The porting matrix is markdown, not a stamped JSON payload, so it gets a plain
          # `git diff` rather than the filter — there is no generatedAt or commit SHA in it
          # to strip, and every byte below the marker is Core's. It is checked alongside the
          # four rather than in its own step because a release moves BOTH, and splitting
          # them would open two PRs for one event.
          git diff --quiet -- "$MIRROR" || content_changed=yes
          # The palette lands in TWO places: src/data/palette.json (stamped, so it goes
          # through the filter with the other four above) and a generated block inside
          # global.css. The CSS gets a plain diff for the same reason the mirror does —
          # no generatedAt and no SHA in it to strip. That is not an accident of the
          # format: collect-palette.mjs deliberately keeps every per-run byte OUT of the
          # CSS, because a stamp there would make this line report drift daily and the
          # bot would PR the site stylesheet every morning with no colour having changed.
          git diff --quiet -- "$PALETTE_CSS" || content_changed=yes
          # Reported as a step output, not just a summary line, because the marker step below
          # keys on it: a fleet state is only worth remembering as swept if the sweep actually
          # found the data in step. Set on BOTH paths so the step's absence and a `yes` can
          # never be confused.
          echo "drift=${content_changed}" >>"$GITHUB_OUTPUT"
          if [ "$content_changed" = no ]; then
            git checkout -- src/data/generated.json src/data/snippets.json \
                            src/data/corpus.json src/data/coverage.json \
                            src/data/palette.json "$PALETTE_CSS" "$MIRROR"
            echo "✅ site data already in step with the fleet" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # persist-credentials:false left origin unauthenticated — point it at the token
          # so the push authenticates as the App (or PAT), the identity that triggers CI.
          git remote set-url origin "https://x-access-token:${FLEET_TOKEN}@github.com/${OWNER}/${REPO}.git"
          git switch -C "$BRANCH"
          git add src/data/generated.json src/data/snippets.json \
                  src/data/corpus.json src/data/coverage.json \
                  src/data/palette.json "$PALETTE_CSS" "$MIRROR"
          git commit -m "chore(data): refresh fleet metrics, config snippets, corpus, coverage, palette + porting matrix (fleet-sync bot)"
          git push -f -u origin "$BRANCH"
          # Idempotent: update the existing PR if one is already open for this branch.
          if [ -z "$(gh pr list --repo "${OWNER}/${REPO}" --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "${OWNER}/${REPO}" --head "$BRANCH" --base "$DEFAULT_BRANCH" \
              --title "chore(data): refresh fleet metrics, config snippets, corpus, coverage, palette + porting matrix" \
              --body "Automated by the fleet-sync bot. The derived site data (\`generated.json\` — changelog + by-the-numbers; \`snippets.json\` — the Config explorer's baked source files; \`corpus.json\` — the red/blue corpus from htpx; \`coverage.json\` — Sigma detection coverage from dotfiles-Defense; \`palette.json\` plus the generated block in \`global.css\` — the Tokyo Night table, from Core's \`theme/palette.toml\`) was behind the fleet, or the mirrored porting matrix was behind Core's latest release. This regenerates them via \`npm run data\` and re-mirrors \`reference/porting-matrix.md\` via \`npm run mirror\`. A diff in \`global.css\` means Core RESTYLED — look at those colours before merging, because they repaint the site. Review, let the build run, then merge — deploy.yml redeploys on merge."
          fi
          echo "📊 opened/updated PR on \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

      # Remember that THIS fleet state has been swept and the data was in step, so the
      # hourly poll stops re-cloning it. See the long note on the precheck job for why this
      # is load-bearing rather than an optimisation: the committed generatedFrom stamps only
      # advance when a refresh PR merges, so without a marker a fleet commit that moved no
      # published content would leave the poll's comparison unequal forever and it would
      # clone twelve repos every hour to rediscover the same nothing.
      #
      # Deliberately NOT written when drift WAS found: that window is covered by the
      # precheck's open-PR guard, and a refresh PR someone closes unmerged should let the
      # next poll open it again rather than be silenced by a marker.
      #
      # The file goes at the workspace root, not in the checkout — this job checks the site
      # out into dotfiles-web/ so the fleet can sit beside it, and the cache action resolves
      # `path` against the workspace. Its contents are irrelevant; the KEY is the record.
      - name: Record this fleet state as swept
        if: steps.refresh.outputs.drift == 'no' && needs.precheck.outputs.fingerprint != ''
        env:
          FINGERPRINT: ${{ needs.precheck.outputs.fingerprint }}
        run: printf '%s\n' "$FINGERPRINT" > "$GITHUB_WORKSPACE/.fleet-swept"
      - name: Save the swept marker
        if: steps.refresh.outputs.drift == 'no' && needs.precheck.outputs.fingerprint != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fleet-swept
          key: fleet-swept-${{ needs.precheck.outputs.fingerprint }}
